name: Update SPCX quote

# Pulls the delayed SPCX quote from Twelve Data every 15 minutes during
# NYSE trading hours and commits it as quote.json, so the static page
# can serve fresh quotes same-origin (no client-side cross-border fetch).
on:
  schedule:
    # 13:30-20:00 UTC == 09:30-16:00 ET (EDT), Mon-Fri
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch quote from Twelve Data
        env:
          TD_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TD_KEY}" ]; then
            echo "TWELVEDATA_API_KEY not set, keeping previous snapshot."
            exit 0
          fi
          json=$(curl -sL --max-time 25 "https://api.twelvedata.com/quote?symbol=SPCX&interval=1day&apikey=${TD_KEY}")
          echo "${json}" | head -c 500
          echo
          price=$(echo "${json}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('close',''))")
          chg=$(echo "${json}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('percent_change',''))")
          dt=$(echo "${json}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('datetime',''))")
          if ! [[ "${price}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid quote, keeping previous snapshot."
            exit 0
          fi
          qdate="${dt%% *}"
          qtime="${dt#* }"
          qtime="${qtime%:*}"
          if ! [[ "${qdate}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! [[ "${qtime}" =~ ^[0-9]{2}:[0-9]{2}$ ]]; then
            echo "Invalid datetime, keeping previous snapshot."
            exit 0
          fi
          printf '{"symbol":"SPCX","price":%s,"changePct":%s,"date":"%s","time":"%s","source":"twelvedata","delayMin":15}\n' \
            "${price}" "${chg}" "${qdate}" "${qtime}" > quote.json
          cat quote.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quote.json
          if git diff --cached --quiet; then
            echo "Quote unchanged, nothing to commit."
          else
            git commit -m "Update SPCX quote snapshot"
            git push
          fi
